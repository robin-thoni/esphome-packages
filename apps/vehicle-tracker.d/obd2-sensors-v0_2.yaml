canbus_isotp:
  - id: obd2_broadcast
    tx_can_id: 0x7DF
    rx_can_id: 0x7DF # Useless
  - id: obd2_E0
    tx_can_id: 0x7E0
    rx_can_id: 0x7E8
  - id: obd2_E1
    tx_can_id: 0x7E1
    rx_can_id: 0x7E9
  - id: obd2_E2
    tx_can_id: 0x7E2
    rx_can_id: 0x7EA
  - id: obd2_E3
    tx_can_id: 0x7E3
    rx_can_id: 0x7EB
  - id: obd2_E4
    tx_can_id: 0x7E4
    rx_can_id: 0x7EC
  - id: obd2_E5
    tx_can_id: 0x7E5
    rx_can_id: 0x7ED
  - id: obd2_E6
    tx_can_id: 0x7E6
    rx_can_id: 0x7EE
  - id: obd2_E7
    tx_can_id: 0x7E7
    rx_can_id: 0x7EF

obd2_client:
  - id: obd2_client0
    canbus_isotp_broadcast_id: obd2_broadcast
    canbus_isotp_ecus_ids:
      - obd2_E0
      - obd2_E1
      - obd2_E2
      - obd2_E3
      - obd2_E4
      - obd2_E5
      - obd2_E6
      - obd2_E7

sensor:
  - platform: obd2_client
    id: vehicle_rpm
    name: "RPM"
    icon: mdi:fan
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    update_interval: 1s
    type: pid
    service: 0x01
    pid: 0x0C
    lambda: |
      if (x.size() >= 2) {
        uint16_t raw = (x[0] << 8) | x[1];
        return raw / 4.0f;
      }
      return {};
    filters:
      - timeout:
          timeout: 1min
          value: NaN
      - lambda: |
          return (int)(x / 100) * 100;
      - delta: 100
  - platform: obd2_client
    id: vehicle_speed
    name: "Speed"
    icon: mdi:speedometer
    unit_of_measurement: "km/h"
    device_class: speed
    accuracy_decimals: 0
    update_interval: 1s
    type: pid
    service: 0x01
    pid: 0x0D
    filters:
      - timeout:
          timeout: 1min
          value: NaN
      - delta: 5

text_sensor:
  - platform: obd2_client
    id: vehicle_dtcs_confirmed
    name: "DTCs - Confirmed"
    icon: mdi:alert-circle
    update_interval: 60s
    type: dtc
    service: 0x03
  - platform: obd2_client
    id: vehicle_dtcs_pending
    name: "DTCs - Pending"
    icon: mdi:alert
    update_interval: 60s
    type: dtc
    service: 0x07
  - platform: obd2_client
    id: vehicle_dtcs_permanent
    name: "DTCs - Permanent"
    icon: mdi:alert-circle
    update_interval: 60s
    type: dtc
    service: 0x0A

binary_sensor:
  - platform: obd2_client
    id: vehicle_mil
    name: "MIL"
    icon: mdi:engine-outline
    device_class: problem
    update_interval: 1s
    type: pid
    service: 0x01
    pid: 0x01
